name: SHADOWWATCH public estate monitoring
on:
  push:
    branches: [main]
    paths:
      - 'shadowwatch/probe.py'
      - '.github/workflows/shadowwatch-monitor.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: shadowwatch-monitor
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public endpoints and TLS
        run: python3 shadowwatch/probe.py
      - name: Commit sanitized public status snapshot
        run: |
          git config user.name "shadowwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowwatch/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh SHADOWWATCH public status"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep "$attempt"
            done
            exit 1
          fi
